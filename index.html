<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>OBS用 トランジション統合ジェネレーター</title>
  <style>
    body { font-family: sans-serif; background: #222; color: #eee; padding: 20px; margin: 0; }
    .container { max-width: 680px; margin: 0 auto; background: #333; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
    h2 { margin-top: 0; text-align: center; border-bottom: 2px solid #555; padding-bottom: 10px; }
    
    /* タブ切り替えボタン */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; background: #444; border: none; color: #aaa; font-weight: bold; font-size: 1rem; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #007bff; color: #fff; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .step { background: #444; margin-bottom: 15px; padding: 15px; border-radius: 6px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.95rem; }
    select, input[type="file"] { width: 100%; padding: 8px; background: #222; color: #fff; border: 1px solid #666; border-radius: 4px; box-sizing: border-box; }
    
    .generate-btn { width: 100%; background: #28a745; color: #fff; border: none; cursor: pointer; font-size: 1.1rem; font-weight: bold; margin-top: 15px; padding: 15px; border-radius: 6px; transition: 0.2s; }
    .generate-btn:hover { background: #218838; }
    .generate-btn:disabled { background: #666; cursor: not-allowed; }
    
    /* メインプレビュー用キャンバス */
    canvas.main-canvas { 
      width: 100%; aspect-ratio: 16/9; margin-top: 20px; border: 2px solid #111; border-radius: 4px;
      background: #111 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="10" height="10" fill="%23222"/><rect x="10" y="10" width="10" height="10" fill="%23222"/></svg>') repeat; 
    }
    
    /* サムネイル選択エリア（アス比崩れ防止） */
    #thumb-container { display: none; margin-top: 10px; text-align: center; background: #222; padding: 10px; border-radius: 4px; }
    .thumb-wrapper { display: inline-block; position: relative; max-width: 100%; }
    #thumb-canvas { 
      cursor: crosshair; border: 2px solid #555; border-radius: 3px; 
      max-height: 220px; max-width: 100%; 
      width: auto !important; height: auto !important; 
      aspect-ratio: auto !important; 
      display: block; margin: 0 auto; 
    }
    .thumb-tip { font-size: 0.8rem; color: #f1c40f; margin-top: 5px; }

    .download-link { display: none; text-align: center; background: #e67e22; color: white; padding: 15px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 15px; }
    .download-link:hover { background: #d35400; }
    
    .obs-guide { background: #222; border-left: 4px solid #f1c40f; padding: 12px 15px; margin-top: 15px; border-radius: 4px; font-size: 0.9rem; line-height: 1.5; }
    .obs-guide h4 { margin: 0 0 5px 0; color: #f1c40f; }
    .obs-guide ul { margin: 0; padding-left: 20px; color: #ccc; }

    .note { font-size: 0.85rem; color: #aaa; margin-top: 5px; }
  </style>
</head>
<body>

<div class="container">
  <h2>🎬 OBS トランジション・メーカー</h2>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('simple')">1. シンプル切替型</button>
    <button class="tab-btn" onclick="switchTab('corkboard')">2. コルクボード型 (5枚)</button>
  </div>

  <!-- ================= タブ1: シンプル切替型 ================= -->
  <div id="tab-simple" class="tab-content active">
    <div class="step">
      <label>① エフェクト1 (透明 → 画像1)</label>
      <select id="s-fx1">
        <option value="fade">フェードイン</option>
        <option value="slide-left">右からスライド</option>
        <option value="slide-up">下からスライド</option>
      </select>
    </div>
    <div class="step">
      <label>② 画像1</label>
      <input type="file" id="s-img1" accept="image/png, image/jpeg">
    </div>
    <div class="step">
      <label>③ エフェクト2 (画像1 → 画像2)</label>
      <select id="s-fx2">
        <option value="fade">クロスフェード</option>
        <option value="slide-left">左へ押し出し</option>
        <option value="slide-up">上へ押し出し</option>
      </select>
    </div>
    <div class="step">
      <label>④ 画像2</label>
      <input type="file" id="s-img2" accept="image/png, image/jpeg">
    </div>
    <div class="step">
      <label>⑤ エフェクト3 (画像2 → 透明)</label>
      <select id="s-fx3">
        <option value="fade">フェードアウト</option>
        <option value="slide-left">左へスライドアウト</option>
        <option value="slide-up">上へスライドアウト</option>
      </select>
    </div>
    <button class="generate-btn" id="s-btn" onclick="generateSimple()">トランジション動画を生成 (約3秒)</button>
    <a id="s-download" class="download-link" download="simple_transition.webm">📥 WebMをダウンロード</a>

    <div class="obs-guide">
      <h4>📌 OBS設定ガイド (シンプル切替型)</h4>
      <ul>
        <li><b>トランジションの種類:</b> スティンガー</li>
        <li><b>トランジションポイント (ミリ秒):</b> <code>1500</code></li>
      </ul>
    </div>
  </div>

  <!-- ================= タブ2: コルクボード型 (5枚) ================= -->
  <div id="tab-corkboard" class="tab-content">
    <div class="step">
      <label>① 左上の写真</label>
      <input type="file" id="c-img-tl" accept="image/png, image/jpeg">
    </div>
    <div class="step">
      <label>② 右上の写真</label>
      <input type="file" id="c-img-tr" accept="image/png, image/jpeg">
    </div>
    <div class="step">
      <label>③ 真ん中の写真（★最後にズームされるメイン）</label>
      <input type="file" id="c-img-c" accept="image/png, image/jpeg">
      
      <!-- サムネイル選択エリア -->
      <div id="thumb-container">
        <div style="font-size:0.85rem; margin-bottom:5px; color:#f1c40f;">👇 アップ（ズーム）したい場所をクリックしてください</div>
        <div class="thumb-wrapper">
          <canvas id="thumb-canvas"></canvas>
        </div>
        <div class="thumb-tip" id="thumb-tip">📍 指定位置: 中央 (クリックで変更可能)</div>
      </div>
    </div>
    <div class="step">
      <label>④ 左下の写真</label>
      <input type="file" id="c-img-bl" accept="image/png, image/jpeg">
    </div>
    <div class="step">
      <label>⑤ 右下の写真</label>
      <input type="file" id="c-img-br" accept="image/png, image/jpeg">
    </div>

    <div class="step">
      <label>⑥ 真ん中写真のズーム倍率</label>
      <select id="c-zoom-level">
        <option value="2.5">控えめ (2.5倍)</option>
        <option value="3.5" selected>標準 (3.5倍)</option>
        <option value="5.0">しっかりアップ (5.0倍)</option>
        <option value="7.0">超アップ (7.0倍)</option>
      </select>
    </div>

    <button class="generate-btn" id="c-btn" onclick="generateCorkboard()">トランジション動画を生成 (約3.5秒)</button>
    <a id="c-download" class="download-link" download="corkboard_transition.webm">📥 WebMをダウンロード</a>

    <div class="obs-guide">
      <h4>📌 OBS設定ガイド (コルクボード型)</h4>
      <ul>
        <li><b>トランジションの種類:</b> スティンガー</li>
        <li><b>トランジションポイント (ミリ秒):</b> <code>2800</code></li>
      </ul>
    </div>
  </div>

  <canvas id="canvas" class="main-canvas" width="1920" height="1080"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fps = 60;

function switchTab(type) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
  
  if(type === 'simple') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('tab-simple').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('tab-corkboard').classList.add('active');
  }
}

const loadImage = (file) => {
  return new Promise((resolve, reject) => {
    if (!file) return reject('画像がすべて選択されているか確認してください。');
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
};

// ==========================================
// 真ん中写真のサムネイル ＆ クリック位置指定ロジック
// ==========================================
let cImgCenterObj = null;
let focusPoint = { x: 0.5, y: 0.5 };

const imgCenterInput = document.getElementById('c-img-c');
const thumbContainer = document.getElementById('thumb-container');
const thumbCanvas = document.getElementById('thumb-canvas');
const thumbCtx = thumbCanvas.getContext('2d');
const thumbTip = document.getElementById('thumb-tip');

imgCenterInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    cImgCenterObj = await loadImage(file);
    thumbContainer.style.display = 'block';
    
    // サムネイルのアスペクト比を完璧に維持
    const maxDim = 220;
    const aspect = cImgCenterObj.width / cImgCenterObj.height;
    if (aspect >= 1) {
      thumbCanvas.width = maxDim;
      thumbCanvas.height = maxDim / aspect;
    } else {
      thumbCanvas.height = maxDim;
      thumbCanvas.width = maxDim * aspect;
    }
    
    focusPoint = { x: 0.5, y: 0.5 };
    drawThumbnail();
  } catch(err) {
    console.log(err);
  }
});

function drawThumbnail() {
  if (!cImgCenterObj) return;
  thumbCtx.clearRect(0, 0, thumbCanvas.width, thumbCanvas.height);
  thumbCtx.drawImage(cImgCenterObj, 0, 0, thumbCanvas.width, thumbCanvas.height);

  const px = focusPoint.x * thumbCanvas.width;
  const py = focusPoint.y * thumbCanvas.height;

  thumbCtx.strokeStyle = '#e74c3c';
  thumbCtx.lineWidth = 2;
  thumbCtx.beginPath();
  thumbCtx.arc(px, py, 12, 0, Math.PI * 2);
  thumbCtx.stroke();

  thumbCtx.fillStyle = '#e74c3c';
  thumbCtx.beginPath();
  thumbCtx.arc(px, py, 4, 0, Math.PI * 2);
  thumbCtx.fill();
}

thumbCanvas.addEventListener('click', (e) => {
  const rect = thumbCanvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  focusPoint.x = Math.max(0, Math.min(1, clickX / thumbCanvas.clientWidth));
  focusPoint.y = Math.max(0, Math.min(1, clickY / thumbCanvas.clientHeight));

  drawThumbnail();
  thumbTip.textContent = `📍 指定位置: X=${Math.round(focusPoint.x*100)}%, Y=${Math.round(focusPoint.y*100)}%`;
});

// ==========================================
// 1. シンプル切替型のロジック
// ==========================================
async function generateSimple() {
  const btn = document.getElementById('s-btn');
  const dl = document.getElementById('s-download');
  try {
    btn.disabled = true;
    btn.textContent = '生成中...';
    dl.style.display = 'none';

    const img1 = await loadImage(document.getElementById('s-img1').files[0]);
    const img2 = await loadImage(document.getElementById('s-img2').files[0]);
    const fx1 = document.getElementById('s-fx1').value;
    const fx2 = document.getElementById('s-fx2').value;
    const fx3 = document.getElementById('s-fx3').value;

    const phaseDuration = 1000;
    const totalDuration = 3000;
    const stream = canvas.captureStream(fps);
    const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
    const chunks = [];

    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      dl.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      dl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'トランジション動画を生成 (約3秒)';
    };

    mediaRecorder.start();
    let startTime = null;

    const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    function render(timestamp) {
      if(!startTime) startTime = timestamp;
      const elapsed = timestamp - startTime;
      const w = canvas.width; const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      if (elapsed < phaseDuration) {
        const p = ease(elapsed / phaseDuration);
        ctx.globalAlpha = fx1 === 'fade' ? p : 1;
        if(fx1 === 'slide-left') ctx.drawImage(img1, w * (1 - p), 0, w, h);
        else if(fx1 === 'slide-up') ctx.drawImage(img1, 0, h * (1 - p), w, h);
        else ctx.drawImage(img1, 0, 0, w, h);
      } else if (elapsed < phaseDuration * 2) {
        const p = ease((elapsed - phaseDuration) / phaseDuration);
        ctx.globalAlpha = 1;
        if(fx2 === 'fade') {
          ctx.drawImage(img1, 0, 0, w, h);
          ctx.globalAlpha = p;
          ctx.drawImage(img2, 0, 0, w, h);
        } else if(fx2 === 'slide-left') {
          ctx.drawImage(img1, -w * p, 0, w, h);
          ctx.drawImage(img2, w * (1 - p), 0, w, h);
        } else if(fx2 === 'slide-up') {
          ctx.drawImage(img1, 0, -h * p, w, h);
          ctx.drawImage(img2, 0, h * (1 - p), w, h);
        }
      } else if (elapsed < totalDuration) {
        const p = ease((elapsed - phaseDuration * 2) / phaseDuration);
        ctx.globalAlpha = fx3 === 'fade' ? (1 - p) : 1;
        if(fx3 === 'slide-left') ctx.drawImage(img2, -w * p, 0, w, h);
        else if(fx3 === 'slide-up') ctx.drawImage(img2, 0, -h * p, w, h);
        else ctx.drawImage(img2, 0, 0, w, h);
      } else {
        ctx.clearRect(0, 0, w, h);
        mediaRecorder.stop();
        return;
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  } catch(err) {
    alert(err);
    btn.disabled = false;
    btn.textContent = 'トランジション動画を生成 (約3秒)';
  }
}

// ==========================================
// 2. コルクボード型 (5枚レイアウト) のロジック
// ==========================================
let corkPattern = null;
function createCorkPattern() {
  const c = document.createElement('canvas');
  c.width = 250; c.height = 250;
  const x = c.getContext('2d');
  x.fillStyle = '#b7804a';
  x.fillRect(0, 0, 250, 250);
  for(let i = 0; i < 2000; i++) {
    x.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.15)';
    x.fillRect(Math.random() * 250, Math.random() * 250, Math.random() * 4 + 1, Math.random() * 4 + 1);
  }
  corkPattern = ctx.createPattern(c, 'repeat');
}

function drawPhoto(img, x, y, scale, rotation, pinColor, isCenterMain = false, zoomProgress = 0, focus = {x:0.5, y:0.5}) {
  ctx.save();

  const imgRatio = img.width / img.height;
  let bw, bh;
  if (imgRatio > 1.1) { bw = 540; bh = 303; }  // 横長 (5枚配置用に少しサイズ調整)
  else if (imgRatio < 0.9) { bw = 303; bh = 540; } // 縦長
  else { bw = 400; bh = 400; }
  const padding = 18;

  let drawX = x;
  let drawY = y;
  if (isCenterMain && zoomProgress > 0) {
    drawX = x - (focus.x - 0.5) * bw * (scale - 1);
    drawY = y - (focus.y - 0.5) * bh * (scale - 1);
  }

  ctx.translate(drawX, drawY);
  ctx.rotate(rotation);
  ctx.scale(scale, scale);

  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 22; ctx.shadowOffsetX = 6; ctx.shadowOffsetY = 15;

  ctx.fillStyle = '#fdfdfd';
  ctx.fillRect(-bw/2 - padding, -bh/2 - padding, bw + padding*2, bh + padding*2);

  ctx.shadowColor = 'transparent';
  ctx.drawImage(img, -bw/2, -bh/2, bw, bh);

  const pinY = -bh/2 - padding + 10;
  ctx.fillStyle = '#888';
  ctx.fillRect(-2, pinY, 4, 15);
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 5;
  ctx.beginPath(); ctx.arc(0, pinY, 13, 0, Math.PI * 2); ctx.fillStyle = pinColor; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.arc(-3, pinY - 3, 3, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();

  ctx.restore();
}

async function generateCorkboard() {
  const btn = document.getElementById('c-btn');
  const dl = document.getElementById('c-download');
  const zoomMultiplier = parseFloat(document.getElementById('c-zoom-level').value);

  try {
    btn.disabled = true;
    btn.textContent = '🎥 コルクボード生成中...';
    dl.style.display = 'none';

    const imgTL = await loadImage(document.getElementById('c-img-tl').files[0]);
    const imgTR = await loadImage(document.getElementById('c-img-tr').files[0]);
    const imgC = cImgCenterObj || await loadImage(document.getElementById('c-img-c').files[0]);
    const imgBL = await loadImage(document.getElementById('c-img-bl').files[0]);
    const imgBR = await loadImage(document.getElementById('c-img-br').files[0]);

    if (!corkPattern) createCorkPattern();

    const totalDuration = 3500;
    const stream = canvas.captureStream(fps);
    const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
    const chunks = [];

    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      dl.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      dl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'トランジション動画を生成 (約3.5秒)';
    };

    mediaRecorder.start();
    let startTime = null;

    const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
    const easeInOutCubic = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    const easeOutBack = x => { const c1 = 1.70158; return 1 + (c1 + 1) * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
    const getProgress = (elapsed, start, end) => Math.max(0, Math.min(1, (elapsed - start) / (end - start)));

    function render(timestamp) {
      if(!startTime) startTime = timestamp;
      const elapsed = timestamp - startTime;
      const w = canvas.width; const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const pFade = getProgress(elapsed, 2600, 3500);
      ctx.globalAlpha = 1.0 - easeInOutCubic(pFade);
      ctx.filter = pFade > 0 ? `blur(${pFade * 40}px)` : 'none';

      // コルクボード背景の出現
      const pCork = getProgress(elapsed, 0, 400);
      ctx.save();
      ctx.translate(0, -h * (1 - easeOutCubic(pCork)));
      ctx.fillStyle = corkPattern;
      ctx.fillRect(0, 0, w, h);
      ctx.restore();

      // 1. 左上写真
      const pTL = getProgress(elapsed, 300, 750);
      if (pTL > 0) {
        drawPhoto(imgTL, w * 0.22, h * 0.28, easeOutBack(pTL), -10 * (Math.PI/180) * easeOutBack(pTL), '#e74c3c');
      }

      // 2. 右上写真
      const pTR = getProgress(elapsed, 400, 850);
      if (pTR > 0) {
        drawPhoto(imgTR, w * 0.78, h * 0.28, easeOutBack(pTR), 12 * (Math.PI/180) * easeOutBack(pTR), '#3498db');
      }

      // 4. 左下写真
      const pBL = getProgress(elapsed, 500, 950);
      if (pBL > 0) {
        drawPhoto(imgBL, w * 0.22, h * 0.72, easeOutBack(pBL), 8 * (Math.PI/180) * easeOutBack(pBL), '#9b59b6');
      }

      // 5. 右下写真
      const pBR = getProgress(elapsed, 600, 1050);
      if (pBR > 0) {
        drawPhoto(imgBR, w * 0.78, h * 0.72, easeOutBack(pBR), -14 * (Math.PI/180) * easeOutBack(pBR), '#2ecc71');
      }

      // 3. 真ん中メイン写真 (最後に登場してズーム)
      const pCenterPop = getProgress(elapsed, 700, 1200);
      const pCenterZoom = getProgress(elapsed, 1800, 2600);
      if (pCenterPop > 0) {
        const baseScale = easeOutBack(pCenterPop);
        const zoomProg = easeInOutCubic(pCenterZoom);
        const zoomScale = baseScale + zoomProg * zoomMultiplier;
        const rot = 4 * (Math.PI/180) * easeOutBack(pCenterPop) * (1 - zoomProg);
        
        drawPhoto(imgC, w/2, h/2, zoomScale, rot, '#f1c40f', true, zoomProg, focusPoint);
      }

      ctx.globalAlpha = 1.0;
      ctx.filter = 'none';

      if (elapsed < totalDuration) {
        requestAnimationFrame(render);
      } else {
        ctx.clearRect(0, 0, w, h);
        mediaRecorder.stop();
      }
    }
    requestAnimationFrame(render);
  } catch(err) {
    alert(err);
    btn.disabled = false;
    btn.textContent = 'トランジション動画を生成 (約3.5秒)';
  }
}
</script>
</body>
</html>
